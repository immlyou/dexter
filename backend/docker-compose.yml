version: '3.8'

# Required environment (e.g. in backend/.env next to this file; see .env.example):
#   POSTGRES_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dexter-db
    environment:
      POSTGRES_DB: dexter
      POSTGRES_USER: dexter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # Only reachable from this host (for migrations/tools); the API uses the internal network
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexter"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dexter Backend API
  api:
    build:
      # Repo root, so the image contains the root agent code and dependencies
      context: ..
      dockerfile: backend/Dockerfile
    container_name: dexter-api
    # Loopback only by default: put a TLS reverse proxy in front. Set API_BIND_ADDRESS=0.0.0.0
    # to expose it directly (then do not enable TRUST_PROXY_HOPS).
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      # POSTGRES_PASSWORD must be URL-safe (e.g. openssl rand -hex 24)
      DATABASE_URL: postgresql://dexter:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/dexter
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>=32 random bytes, e.g. openssl rand -base64 48)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set and differ from JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: 8000
      NODE_ENV: production
      # Browser tool is disabled for web users (no Chromium in the image)
      DEXTER_WEB_MODE: "1"
      # Number of reverse proxies in front of the API that append to X-Forwarded-For
      # (0 = use the socket peer address). Only set this if clients cannot bypass them.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # Migrations run at container start; set to 0 if you apply them separately
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      # LLM API Keys (from host environment)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      FINANCIAL_DATASETS_API_KEY: ${FINANCIAL_DATASETS_API_KEY:-}
      EXASEARCH_API_KEY: ${EXASEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      # Scratchpads and API cache (DEXTER_DATA_DIR, owned by the image's bun user)
      - dexter_data:/app/backend/.dexter
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  dexter_data:
    driver: local
